name: publish

on:
  push:
    tags: [ v* ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          9.x
          10.x
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d')" >> $GITHUB_ENV
    - name: Build
      run: |
        dotnet pack --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.AB/NewLife.AB.csproj
    - name: Publish to GitHub Packages
      id: ghpackages
      continue-on-error: true
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      id: nuget
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
    - name: Create GitHub Release
      id: release
      if: startsWith(github.ref, 'refs/tags/')
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $tag 已存在，跳过"
          exit 0
        fi
        version="${tag#v}"
        pattern="^## v?${version}([[:space:](]|$)"
        notes="$RUNNER_TEMP/release-notes.md"
        if grep -qE "$pattern" ChangeLog.md; then
          awk -v pat="$pattern" '
            $0 ~ pat { flag = 1; print; next }
            flag && /^## / { exit }
            flag { print }
          ' ChangeLog.md > "$notes"
        else
          notes=""
        fi
        assets=()
        for f in out/*.nupkg out/*.snupkg; do
          if [ -e "$f" ]; then
            assets+=("$f")
          fi
        done
        args=(release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag)
        if [ -n "$notes" ]; then
          args+=(--notes-file "$notes")
        else
          args+=(--generate-notes)
        fi
        gh "${args[@]}" "${assets[@]}"
    - name: Publish Summary
      if: always()
      run: |
        echo "### 发布结果" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| 渠道 | 结果 |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
        echo "| GitHub Packages | ${{ steps.ghpackages.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| NuGet.org | ${{ steps.nuget.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| GitHub Release | ${{ steps.release.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
